services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: digital_alpha
      POSTGRES_USER: digital_alpha
      POSTGRES_PASSWORD: digital_alpha
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digital_alpha -d digital_alpha"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

