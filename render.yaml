services:
  - type: web
    name: coinwise-api
    runtime: docker
    rootDir: api
    dockerfilePath: api/Dockerfile
    dockerContext: api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Kolkata

